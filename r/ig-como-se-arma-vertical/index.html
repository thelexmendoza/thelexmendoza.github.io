:root { --bg: #fafafa; --text: #0a0a0a; --muted: #4a4a4a; --accent: #d90429; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --text: #fafafa; --muted: #bdbdbd; --accent: #ff5a4d; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-content: center; padding: 34px 21px; background: var(--bg); color: var(--text); font: 300 16px/1.55 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }

.linea { position: relative; height: 1px; margin-top: 8px; background: var(--muted); opacity: .5; }
.linea::after { content: ""; position: absolute; inset: -4px auto -4px 0; width: 0; border-right: 1px solid var(--accent); background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 40%, transparent)); }
